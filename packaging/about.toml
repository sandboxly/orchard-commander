# cargo-about configuration for the Rust crates' licence notice that ships
# with every package (THIRD-PARTY-LICENSES.txt). Generate it with
#
#   cargo about generate -c packaging/about.toml -m app/Cargo.toml packaging/about.hbs
#
# The bundled C/C++ libraries that are not Rust crates (FFmpeg, PDFium,
# UnRAR) ship their own texts: see licenses/README.md.

# Preferred first when a crate offers a choice.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "IJG",
    "bzip2-1.0.6",
    "MPL-2.0",
    "WTFPL",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
