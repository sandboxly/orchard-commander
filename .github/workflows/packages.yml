name: Package managers

# Builds and tests the winget and Chocolatey packages for a published release.
# Run by hand after a release: Actions → Package managers → Run workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version (without the v)
        required: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write the manifests (checksums from the release)
        run: python packaging/manifests.py $env:VERSION --out manifests
      - name: Chocolatey package
        shell: pwsh
        run: |
          choco pack manifests\chocolatey\orchard-commander.nuspec --out manifests\chocolatey
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Test the Chocolatey package (install, run, uninstall)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          choco install orchard-commander --source "'$PWD\manifests\chocolatey;https://community.chocolatey.org/api/v2/'" -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = "${env:ProgramFiles}\Orchard Commander\orchard-commander.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $run = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($run.ExitCode) { throw "self-test failed ($($run.ExitCode))" }
          choco uninstall orchard-commander -y --no-progress
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
      - name: Validate the winget manifests
        shell: pwsh
        run: |
          $dir = "manifests\winget\manifests\s\Sandboxly\OrchardCommander\$env:VERSION"
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            # An older winget warns about newer schema headers ("succeeded with warnings"): that's fine.
            $out = winget validate --manifest $dir | Out-String
            Write-Host $out
            if ($out -notmatch "Manifest validation succeeded") { throw "winget validate failed" }
            exit 0  # don't pass winget's warning exit code on
          } else {
            Write-Host "::notice::winget is not available on this runner; the manifests were not validated"
          }
      - name: Test the winget manifests (install, run, uninstall)
        # winget on GitHub's Windows Server runners can hang; winget-pkgs tests the install in its own sandbox.
        timeout-minutes: 10
        continue-on-error: true
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) { Write-Host "::notice::no winget on this runner"; exit 0 }
          $dir = "manifests\winget\manifests\s\Sandboxly\OrchardCommander\$env:VERSION"
          winget settings --enable LocalManifestFiles
          winget install --manifest $dir --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = "$env:LOCALAPPDATA\Programs\Orchard Commander\orchard-commander.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $run = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput winget-selftest.txt
          Get-Content winget-selftest.txt
          if ($run.ExitCode) { throw "self-test failed ($($run.ExitCode))" }
          winget uninstall --name "Orchard Commander" --silent --disable-interactivity
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: package-managers-${{ inputs.version }}
          path: manifests/
