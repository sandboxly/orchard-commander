name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the builds to this existing release tag (e.g. v1.1.0)
        required: false

permissions:
  contents: write  # attaching builds to releases

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libpulse0 libasound2t64 libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 unrar
      - name: RAR extraction tool (macOS)
        if: runner.os == 'macOS'
        # Homebrew's 7-Zip is built without RAR and its rar cask is disabled: the official 7zz has it.
        run: |
          curl -sSfL https://www.7-zip.org/a/7z2501-mac.tar.xz | sudo tar xJ -C /usr/local/bin 7zz
          7zz i | grep -i rar
      - run: uv sync --locked
      - run: uv run pytest -q -p no:cacheprovider
        timeout-minutes: 20

  build:
    name: Build (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]  # 22.04: an older glibc runs on more distributions
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libpulse0
      - run: uv sync --locked
      - run: uv run python packaging/build.py
      - name: Version
        shell: bash
        run: echo "VERSION=$(uv run python -c 'import orchard_commander as o; print(o.__version__)')" >> "$GITHUB_ENV"
      - name: Self-test of the build
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then ./dist/orchard-commander/orchard-commander.exe --self-test
          else ./dist/orchard-commander/orchard-commander --self-test; fi

      - name: Windows installer and zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" packaging\windows\orchard-commander.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item dist\Orchard-Commander-Setup.exe release\
          Compress-Archive -Path dist\orchard-commander -DestinationPath release\Orchard-Commander-Windows.zip
      - name: Test the installer (silent install, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Start-Process release\Orchard-Commander-Setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER' -Wait
          $app = "$env:LOCALAPPDATA\Programs\Orchard Commander"
          $exe = "$app\orchard-commander.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $bundle = (Resolve-Path dist\orchard-commander).Path
          $want = Get-ChildItem -Recurse -File $bundle | ForEach-Object { $_.FullName.Substring($bundle.Length) }
          $have = Get-ChildItem -Recurse -File $app | ForEach-Object { $_.FullName.Substring($app.Length) }
          $missing = $want | Where-Object { $have -notcontains $_ }
          Write-Host "bundle: $($want.Count) files, installed: $($have.Count), missing: $($missing.Count)"
          $missing | Select-Object -First 25 | ForEach-Object { Write-Host "  missing $_" }
          # A GUI program: PowerShell wouldn't wait for it with "&".
          $run = Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($run.ExitCode) { throw "self-test of the installed app failed ($($run.ExitCode))" }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          # The uninstaller continues from a copy of itself in TEMP: wait for it to finish.
          foreach ($i in 1..30) { if (-not (Test-Path $exe)) { break }; Start-Sleep 1 }
          if (Test-Path $exe) { throw "uninstall left $exe behind" }

      - name: Linux packages (tar.gz, deb, rpm, AppImage)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release
          tar czf release/Orchard-Commander-Linux.tar.gz -C dist orchard-commander
          curl -sSfL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz | tar xz nfpm
          ./nfpm package -f packaging/linux/nfpm.yaml -p deb -t release/Orchard-Commander-Linux-x86_64.deb
          ./nfpm package -f packaging/linux/nfpm.yaml -p rpm -t release/Orchard-Commander-Linux-x86_64.rpm
          # AppImage: the bundle plus a launcher, desktop entry and icon
          mkdir -p AppDir/usr/lib
          cp -a dist/orchard-commander AppDir/usr/lib/orchard-commander
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/orchard-commander.desktop packaging/linux/orchard-commander.png AppDir/
          curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir release/Orchard-Commander-Linux-x86_64.AppImage
      - name: Test the Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y ./release/Orchard-Commander-Linux-x86_64.deb
          orchard-commander --self-test
          sudo apt-get remove -y orchard-commander
          chmod +x release/Orchard-Commander-Linux-x86_64.AppImage
          release/Orchard-Commander-Linux-x86_64.AppImage --appimage-extract-and-run --self-test

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: release/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: gh release upload "${TAG}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
