# cargo-about: licenses of the Rust crates in the release build
# (licenses/THIRD-PARTY-RUST.txt, see scripts/third-party-licenses.sh).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "bzip2-1.0.6",
    "NCSA",
    "WTFPL",
]
# Only what ships: no dev-dependencies or build-time tools (cc, bindgen, …).
ignore-dev-dependencies = true
ignore-build-dependencies = true
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
