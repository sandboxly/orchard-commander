[workspace]
resolver = "3"
members = ["crates/*", "app"]

[workspace.package]
version = "2.1.0"
edition = "2024"
license = "MIT"
authors = ["Stephan Lengl <lengl.stephan@gmail.com>"]
rust-version = "1.90"

[workspace.dependencies]
oc-vfs = { path = "crates/oc-vfs" }
oc-local = { path = "crates/oc-local" }
oc-archive = { path = "crates/oc-archive" }
oc-config = { path = "crates/oc-config" }
oc-rename = { path = "crates/oc-rename" }
oc-search = { path = "crates/oc-search" }
oc-term = { path = "crates/oc-term" }
oc-preview = { path = "crates/oc-preview" }
oc-ui = { path = "crates/oc-ui" }
# Shared with the other Orchard apps (github.com/sandboxly/orchard-commons).
# To work on them locally, see "orchard-* crates" in CLAUDE.md (Commands).
orchard-grid = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
orchard-theme = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
orchard-metadata = { git = "https://github.com/sandboxly/orchard-commons", tag = "v0.2.0" }
thiserror = "2"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
