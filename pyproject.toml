[project]
name = "orchard-commander"
version = "0.1.0"
description = "A modern, cross-platform two-panel file manager with a terminal look"
readme = "README.md"
authors = [
    { name = "Stephan Lengl", email = "lengl.stephan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "keyring>=25.7.0",
    "paramiko>=5.0.0",
    "platformdirs>=4.12.4",
    "py7zr>=1.1.3",
    "pygments>=2.21.0",
    "pypdfium2>=5.14.0",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
    "rarfile>=4.5",
    "send2trash>=2.1.0",
    "smbprotocol>=1.17.0",
]

[project.scripts]
orchard-commander = "orchard_commander.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncssh>=2.24.1",
    "impacket>=0.13.1",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",  # impacket's dependency, test-only
]
