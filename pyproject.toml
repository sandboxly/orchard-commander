[project]
name = "orchard-commander"
version = "1.0.0"
description = "A modern, cross-platform two-panel file manager with a terminal look"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Stephan Lengl", email = "lengl.stephan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "exifread>=3.5.1",
    "hachoir>=3.4.0",
    "keyring>=25.7.0",
    "mutagen>=1.48.1",
    "paramiko>=5.0.0",
    "platformdirs>=4.12.4",
    "ptyprocess>=0.7.0 ; sys_platform != 'win32'",
    "py7zr>=1.1.3",
    "pygments>=2.21.0",
    "pypdfium2>=5.14.0",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
    "pyte>=0.8.2",
    "pywinpty>=3.0.5 ; sys_platform == 'win32'",
    "rarfile>=4.5",
    "send2trash>=2.1.0",
    "smbprotocol>=1.17.0",
    "truststore>=0.10.4",
]

[project.scripts]
orchard-commander = "orchard_commander.__main__:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncssh>=2.24.1",
    "cheroot>=11.1.2",
    "impacket>=0.13.1",
    "markdown>=3.11",
    "moto[server]>=5.2.4",
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "wsgidav>=4.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:ldap3.*",  # impacket's dependency, test-only
]
