[package]
name = "oc-sftp"
description = "SFTP (SSH) file system for Orchard Commander: russh + russh-sftp behind the blocking oc-vfs interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# An in-process SSH/SFTP server for tests (also usable from other crates' tests).
testing = ["dep:rand"]

[dependencies]
oc-vfs.workspace = true
oc-provider = { path = "../oc-provider" }
russh = { version = "0.64.1", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0.1"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3.31"
bytes = "1.10"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2.9"
thiserror.workspace = true
log = "0.4.27"
rand = { version = "0.10", optional = true }

[dev-dependencies]
oc-sftp = { path = ".", features = ["testing"] }
oc-local.workspace = true
oc-archive.workspace = true
tempfile.workspace = true
serde_json = "1"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
rand = "0.10"
