[package]
name = "oc-archive"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["rar"]
# RAR archives through the vendored UnRAR library (RARLAB's UnRAR license:
# freeware, not open source; see licenses/UnRAR.txt). Without this feature
# .rar files are ordinary files.
rar = ["dep:unrar"]

[dependencies]
oc-vfs.workspace = true
thiserror.workspace = true
tempfile = "3.27"
zip = { version = "9.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "zstd", "time"] }
tar = "0.4.46"
flate2 = "1.1"
bzip2 = "0.6"
liblzma = "0.4"
sevenz-rust2 = "0.24"
unrar = { version = "0.5.8", optional = true }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
