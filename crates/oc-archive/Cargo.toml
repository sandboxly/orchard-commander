[package]
name = "oc-archive"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-vfs.workspace = true
thiserror.workspace = true
tempfile = "3.27"
zip = { version = "9.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "lzma", "xz", "zstd", "time"] }
tar = "0.4.46"
flate2 = "1.1"
bzip2 = "0.6"
liblzma = "0.4"
sevenz-rust2 = "0.24"
unrar = "0.5.8"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
