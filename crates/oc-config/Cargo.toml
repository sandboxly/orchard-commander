[package]
name = "oc-config"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
oc-vfs.workspace = true
orchard-theme.workspace = true
thiserror.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
dirs = "6.0"
uuid = { version = "1.10", features = ["v4"] }
# Linux: Secret Service over zbus (pure Rust, like 1.x's jeepney), so neither
# building nor running needs libdbus. async-io rather than tokio: the blocking
# calls run on plain worker threads and must not need a tokio runtime.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
toml = "0.8"
tempfile.workspace = true
